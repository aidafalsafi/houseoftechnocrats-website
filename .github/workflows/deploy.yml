name: Deploy to Arvan Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id "${{ secrets.ARVAN_ACCESS_KEY }}"
          aws configure set aws_secret_access_key "${{ secrets.ARVAN_SECRET_KEY }}"
          aws configure set default.region ir-central1
          aws configure set default.s3.addressing_style path

      - name: Test Arvan bucket
        run: |
          aws s3api list-objects-v2 \
            --bucket houseoftechnocrats \
            --max-items 1 \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir

      - name: Deploy website
        run: |
          aws s3 sync ./ s3://houseoftechnocrats/ \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store"
