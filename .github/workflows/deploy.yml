name: Deploy to Arvan Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Install Chromium for static rendering
        run: npx playwright install --with-deps chromium

      - name: Build and validate the public website
        run: |
          npm run build:seo
          npm run check:seo

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id "${{ secrets.ARVAN_ACCESS_KEY }}"
          aws configure set aws_secret_access_key "${{ secrets.ARVAN_SECRET_KEY }}"
          aws configure set default.region ir-central1
          aws configure set default.s3.addressing_style path

      - name: Deploy website
        run: |
          aws s3 sync ./dist/ s3://houseoftechnocrats/ \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir \
            --delete \
            --acl public-read \
            --exclude ".DS_Store"

      - name: Publish robots.txt with plain-text content type
        run: |
          aws s3 cp ./dist/robots.txt s3://houseoftechnocrats/robots.txt \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir \
            --content-type text/plain \
            --cache-control "public, max-age=300" \
            --acl public-read

      - name: Publish sitemap.xml with XML content type
        run: |
          aws s3 cp ./dist/sitemap.xml s3://houseoftechnocrats/sitemap.xml \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir \
            --content-type application/xml \
            --cache-control "public, max-age=300" \
            --acl public-read

      - name: Fix public access for all existing objects
        run: |
          aws s3api list-objects-v2 \
            --bucket houseoftechnocrats \
            --endpoint-url https://hot.ir-central1.arvanstorage.ir \
            --query 'Contents[].Key' \
            --output text | tr '\t' '\n' | while IFS= read -r key; do
              [ -z "$key" ] && continue

              echo "Making public: $key"

              aws s3api put-object-acl \
                --bucket houseoftechnocrats \
                --key "$key" \
                --acl public-read \
                --endpoint-url https://hot.ir-central1.arvanstorage.ir
            done
