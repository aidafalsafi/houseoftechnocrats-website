name: Deploy to Arvan Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.ARVAN_ACCESS_KEY }}"
          aws configure set aws_secret_access_key "${{ secrets.ARVAN_SECRET_KEY }}"
          aws configure set default.region us-east-1

      - name: Test bucket access
        run: |
          aws s3 ls s3://houseoftechnocrats \
            --endpoint-url https://s3.ir-thr-at1.arvanstorage.ir

      - name: Deploy website
        run: |
          aws s3 sync ./ s3://houseoftechnocrats \
            --endpoint-url https://s3.ir-thr-at1.arvanstorage.ir \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store"
